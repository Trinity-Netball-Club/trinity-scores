name: Fetch Match Day Scores

on:
  workflow_dispatch:

concurrency:
  group: repo-write-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/package-lock.json') }}

      - name: Install Playwright browser
        run: |
          cd scripts
          npx playwright install chromium

      - name: Scrape match-day scores
        run: node scripts/scrape-matchday.js

      - name: Commit updated JSON
        id: commit
        run: |
          git config user.name "Trinity Netball Bot"
          git config user.email "registrations@trinitynetball.com.au"

          git add public/*.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update match-day scores"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 1))
          done

      # See fetch-data.yml for why this is needed: pushes made with the
      # default GITHUB_TOKEN don't trigger other workflows' `on: push`,
      # so we trigger the Pages deployment directly, only when the
      # score patch actually changed something.
      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Upload JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netball-data-matchday
          path: |
            public/fixtures.json